<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
</head>
<body>
    <h1>Haga su reserva</h1>

   <form action="procesareserva.php" method="GET">

    <fieldset>
        <legend>Datos personales</legend>
        
        
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" maxlength="100" required autofocus><br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" maxlength="100" required><br><br>

        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni" maxlength="10" required placeholder="DNI"><br><br>

</fieldset>

<br>

    <fieldset>
        <legend>Datos de su estancia</legend>

        Habitación:
        <input type="radio" id="individual" name="habitacion" value="individual">
        <label for="individual">Individual</label>

        <input type="radio" id="doble" name="habitacion" value="doble">
        <label for="doble">Doble</label>

        <input type="radio" id="triple" name="habitacion" value="triple">
        <label for="triple">Triple</label>

        <br><br>

        <label for="personas">Número de personas:</label>
            <select id="personas" name="personas">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>

        <br><br>

        <label for="mascotas">Llevo mascotas</label>
        <input type="checkbox" name="mascotas" id="mascotas">
        
        <br><br>

        <label for="fecha_llegada">Fecha de llegada</label>
        <input type="date" name="fecha_llegada" id="fecha_llegada">
        
        <br><br>

        <label for="hora_llegada">Hora de llegada</label>
        <input type="time" name="hora_llegada" id="hora_llegada">

    </fieldset>

        <br><br>

        <input type="submit" value="Enviar">
        <input type="submit" value="Reiniciar">

 
    </form> 

    <br><br>

    <a href="index.html">Volver</a>

</body>
</html>
